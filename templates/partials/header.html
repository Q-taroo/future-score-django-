<header class="site-header sticky-top">
  <div class="container header-layout">
    <a href="{% url 'predictions:home' %}" class="brand flex items-center gap-1">
      <span class="brand-symbol" aria-hidden="true">✦</span><span class="accent">FUTURE</span><span>SCORE</span>
    </a>
    <nav class="primary-nav flex items-center gap-4" aria-label="メインメニュー">
      <a href="{% url 'predictions:home' %}">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg>
        <span>ホーム</span>
      </a>
      <a href="{% url 'predictions:list' %}">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4M11 7.5v7M7.5 11h7"/></svg>
        <span>予測一覧</span>
      </a>
      <a href="{% url 'scoring:ranking' %}">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 20v-7H4v7M14 20V9h-4v11M20 20V4h-4v16M3 20h18"/></svg>
        <span>ランキング</span>
      </a>
      <a href="{% url 'predictions:tutorial' %}">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/></svg>
        <span>使い方</span>
      </a>
      {% if user.is_authenticated %}<a href="{% url 'scoring:me_dashboard' %}"><span>マイページ</span></a>{% endif %}
      {% if user.is_authenticated and user.is_admin %}<a href="{% url 'adminpanel:dashboard' %}">管理画面</a>{% endif %}
    </nav>
    <div class="flex items-center gap-2">
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline btn-sm">ログアウト</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm" aria-label="新規登録">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>
          </svg>
          新規登録
        </a>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-sm">ログイン</a>
      {% endif %}
    </div>
  </div>
</header>
