{% extends "base.html" %}
{% block title %}メールアドレス認証 | {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="container-sm py-14" style="max-width:36rem">
  <section class="card text-center" style="padding:3rem 2rem">
    <div class="verification-icon" aria-hidden="true">✉</div>
    <h1 class="text-2xl font-bold mt-4">メールアドレス認証</h1>
    <p class="text-muted mt-6" style="line-height:1.8">
      入力したメールアドレス宛に認証メールを送信しました。<br>
      メールに記載されている認証URLから、24時間以内に認証を完了してください。
    </p>
    <p class="text-xs text-muted mt-4">届かない場合は迷惑メールフォルダもご確認ください。</p>
    <form method="post" action="{% url 'accounts:resend_verification' %}" class="mt-8">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline btn-lg" style="width:100%">確認メールを再送する</button>
    </form>
  </section>
</div>
{% endblock %}
